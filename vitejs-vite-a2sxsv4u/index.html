<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>橘勢待發，職場勝局｜2027 台灣大學校園徵才</title>
    <!-- 引入極輕量、純前端計算的 QRCode 函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
      header { width: 100%; max-width: 440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333333; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; letter-spacing: 1px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background-color: #FF6600; }
      .qr-btn { background: #1A1A1A; border: 1px solid #333333; color: #ccc; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
      .qr-btn:hover { border-color: #FF6600; }
      main { width: 100%; max-width: 440px; margin: auto; padding: 20px 0; }
      footer { width: 100%; max-width: 440px; margin: 0 auto; text-align: center; font-size: 11px; color: #666; padding: 12px 0; border-top: 1px solid #333333; }
      .card { background: #1A1A1A; border: 1px solid #333; border-radius: 16px; padding: 20px; text-align: left; margin-bottom: 16px; }
      .title { color: #FF6600; font-size: 24px; font-weight: 800; text-align: center; margin: 12px 0; }
      .badge { display: inline-block; background: rgba(255,102,0,0.15); border: 1px solid #FF6600; color: #FF6600; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 8px; text-align: center; }
      .primary-btn { width: 100%; background: #FF6600; color: #000; font-weight: 800; font-size: 16px; padding: 14px; border-radius: 12px; border: none; cursor: pointer; margin-top: 12px; }
      .primary-btn:hover { background: #ff771a; }
      .opt-btn { width: 100%; background: #1A1A1A; border: 1px solid #333; color: #ddd; padding: 14px; border-radius: 12px; text-align: left; margin-bottom: 10px; cursor: pointer; font-size: 14px; display: flex; gap: 10px; }
      .opt-btn.selected { border-color: #FF6600; background: rgba(255,102,0,0.1); color: #fff; }
      .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
      .modal-content { background: #1A1A1A; border: 1px solid #FF6600; padding: 24px; border-radius: 20px; max-width: 320px; width: 100%; text-align: center; }
      .hidden { display: none !important; }
      #qrcode img { margin: 0 auto; display: block; border-radius: 8px; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><div class="dot"></div>GAMANIA 2027</div>
      <button id="show-qr-btn" class="qr-btn">📱 現場 QR</button>
    </header>

    <main id="app"></main>

    <footer>© 2027 遊戲橘子集團 Gamania Group. All Rights Reserved.</footer>

    <div id="qr-modal" class="modal hidden">
      <div class="modal-content">
        <h3 style="font-size:14px; margin-bottom:12px;">掃描開啟 2027 校徵探索遊戲</h3>
        <div style="background:#fff; padding:12px; border-radius:12px; display:inline-block; margin-bottom:12px;">
          <!-- 本地演算法動態繪製 QR Code 容器 -->
          <div id="qrcode"></div>
        </div>
        <p style="font-size:12px; color:#888; margin-bottom:12px;">請同學們使用手機相機掃描 QR Code 參與測試！</p>
        <button id="close-qr-btn" style="width:100%; padding:8px; background:#333; color:#fff; border:none; border-radius:8px; cursor:pointer;">關閉視窗</button>
      </div>
    </div>

    <script>
      const VACANCIES = {
        INNOVATOR: [{ name: "遊戲企劃 / 遊戲設計師", url: "https://www.104.com.tw" }, { name: "品牌營銷企劃專員", url: "https://www.104.com.tw" }],
        ANALYST: [{ name: "全端開發工程師", url: "https://www.104.com.tw" }, { name: "數據分析工程師", url: "https://www.104.com.tw" }],
        CONNECTOR: [{ name: "跨國專案管理師 (PM)", url: "https://www.104.com.tw" }, { name: "社群營運專員", url: "https://www.104.com.tw" }],
        EXPLORER: [{ name: "使用者體驗 UX 研究員", url: "https://www.104.com.tw" }, { name: "創新產品市場分析師", url: "https://www.104.com.tw" }]
      };

      const QUESTIONS = [
        { id: 1, title: "專案啟動時，你最想扮演什麼角色？", options: [{ text: "提出顛覆性的創新概念與酷炫玩法", type: "INNOVATOR" }, { text: "規劃技術架構與數據分析流程", type: "ANALYST" }, { text: "跨團隊溝通協調，確保時程順利推進", type: "CONNECTOR" }, { text: "觀察玩家與市場潛在需求，找出新痛點", type: "EXPLORER" }] },
        { id: 2, title: "當遇到突發的系統 Bug 或專案瓶頸，你會？", options: [{ text: "腦力激盪，試圖用非傳統的妙招繞過限制", type: "INNOVATOR" }, { text: "冷靜分析 Error Log，逐步除錯與定位問題", type: "ANALYST" }, { text: "快速召集相關成員，整合資源共同決策", type: "CONNECTOR" }, { text: "深入了解使用者的真實反饋，確認修復方向", type: "EXPLORER" }] },
        { id: 3, title: "在團隊合作中，身邊的人最常稱讚你的是？", options: [{ text: "點子王！總是有源源不絕的靈感", type: "INNOVATOR" }, { text: "邏輯大師！邏輯嚴密且說服力強", type: "ANALYST" }, { text: "神級隊友！有你在進度就很令人安心", type: "CONNECTOR" }, { text: "敏銳雷達！總能察覺別人忽視的細節", type: "EXPLORER" }] },
        { id: 4, title: "面對充滿不確定性的新任務時，你的第一步是？", options: [{ text: "邊做邊嘗試，在實作中驗證各種有趣想法", type: "INNOVATOR" }, { text: "蒐集市場數據與文獻，做嚴謹的評估報告", type: "ANALYST" }, { text: "拜訪相關領域的專家或夥伴，建立合作機制", type: "CONNECTOR" }, { text: "觀察競品優缺點，發掘尚未被滿足的缺口", type: "EXPLORER" }] },
        { id: 5, title: "理想中的工作成就感來自於？", options: [{ text: "打造出令人驚豔、前所未見的創新產品", type: "INNOVATOR" }, { text: "破解高難度複雜問題，優化系統效率", type: "ANALYST" }, { text: "帶領團隊突破重圍，順利達成共同目標", type: "CONNECTOR" }, { text: "洞察市場趨勢，引領全新的商業方向", type: "EXPLORER" }] }
      ];

      const ROLES = {
        INNOVATOR: { title: "創意發想型", subtitle: "The Creative Trailblazer", desc: "你擁有強大的想像力與突破框架的勇氣！在遊戲橘子，你總是能為產品注入驚喜與新鮮感。", traits: ["點子源源不絕", "熱愛探索可能性", "勇於挑戰現狀"] },
        ANALYST: { title: "邏輯解題型", subtitle: "The Master Mind", desc: "你具備卓越的條理性與數據敏感度！在遊戲橘子，你能精準找到關鍵解法。", traits: ["數據導向分析", "結構化思考", "講求高效率與嚴密邏輯"] },
        CONNECTOR: { title: "連結推進型", subtitle: "The Project Catalyst", desc: "你是團隊中不可或缺的黏著劑與推手！在遊戲橘子，你能將多元資源轉化為執行力。", traits: ["擅長跨部門溝通", "資源整合專家", "目標與時程導向"] },
        EXPLORER: { title: "洞察探索型", subtitle: "The Strategic Visionary", desc: "你對周遭變化有著敏銳的感知力！在遊戲橘子，你協助團隊在市場中取得先機。", traits: ["敏銳市場觀察力", "重視使用者體驗", "發掘隱形需求"] }
      };

      let currentStep = 'HOME', qIdx = 0, answers = [null, null, null, null, null], timer = null, qTime = 8, iTime = 8, qrGenerated = false;

      function render() {
        const app = document.getElementById('app');
        if (currentStep === 'HOME') {
          app.innerHTML = `
            <div style="text-align:center;">
              <div class="badge">2027 台灣大學校園徵才</div>
              <h1 class="title">橘勢待發，職場勝局</h1>
              <p style="color:#aaa; font-size:14px; line-height:1.6; margin-bottom:16px;">透過 5 道職涯情境問答，探索你在遊戲橘子集團的獨特職涯天賦！</p>
              <div class="card" style="font-size:12px; color:#ccc;">
                <b style="color:#fff;">💡 遊戲說明：</b><br/>1. 免登入、不搜集個人資料。<br/>2. 選取後按下「確定送出答案」。<br/>3. 每題過場有 8 秒分析時間。
              </div>
              <button id="start-btn" class="primary-btn">開始職涯探索 →</button>
            </div>`;
          document.getElementById('start-btn').onclick = () => { currentStep = 'GAME'; qIdx = 0; answers = [null, null, null, null, null]; render(); startQTimer(); };
        } else if (currentStep === 'GAME') {
          const q = QUESTIONS[qIdx];
          app.innerHTML = `
            <div>
              <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa; margin-bottom:12px;">
                <span>QUESTION ${qIdx + 1} / 5</span>
                <span id="timer-txt" style="color:#FF6600; font-weight:bold;">倒數 ${qTime} 秒</span>
              </div>
              <h2 style="font-size:16px; margin-bottom:16px; font-weight:bold;">${q.title}</h2>
              ${q.options.map((opt, i) => `
                <button class="opt-btn ${answers[qIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
                  <span style="border:1px solid currentColor; padding:0 6px; border-radius:4px; font-weight:bold;">${String.fromCharCode(65+i)}</span>
                  <span>${opt.text}</span>
                </button>`).join('')}
              <div id="err" style="color:red; font-size:12px; height:20px; text-align:center; margin-top:8px;"></div>
              <button class="primary-btn" onclick="submitAns()">確定送出答案 →</button>
            </div>`;
        } else if (currentStep === 'INTER') {
          const isLast = qIdx === 4;
          app.innerHTML = `
            <div style="text-align:center; padding:20px 0;">
              <div class="badge">${isLast ? '⚡ 計算終極職涯角色...' : `⚡ 戰力分析中... (${qIdx+1}/5)`}</div>
              <div style="font-size:36px; font-weight:900; color:#FF6600; margin:20px 0;" id="i-timer">${iTime}</div>
              <div class="card" style="text-align:left;">
                <div style="color:#FF6600; font-size:12px;">已選擇選項：</div>
                <div style="color:#fff; font-weight:bold; margin-top:4px;">${QUESTIONS[qIdx].options[answers[qIdx]].text}</div>
              </div>
            </div>`;
        } else if (currentStep === 'RESULT') {
          const roleKey = getResult();
          const role = ROLES[roleKey];
          const vList = VACANCIES[roleKey];
          app.innerHTML = `
            <div>
              <div class="card" style="border-color:#FF6600; text-align:center;">
                <div style="color:#FF6600; font-size:12px; font-weight:bold;">YOUR CAREER ARCHETYPE</div>
                <h2 style="font-size:22px; color:#fff; margin:8px 0;">${role.title}</h2>
                <p style="color:#aaa; font-size:12px; margin-bottom:12px;">${role.subtitle}</p>
                <p style="color:#ddd; font-size:13px; text-align:left; line-height:1.5;">${role.desc}</p>
              </div>
              <div class="card">
                <div style="color:#fff; font-size:13px; font-weight:bold; margin-bottom:8px;">🚀 推薦延伸職缺領域</div>
                ${vList.map(v => `
                  <div style="display:flex; justify-content:space-between; background:#121212; padding:8px 12px; border-radius:8px; font-size:12px; margin-bottom:6px;">
                    <span>${v.name}</span>
                    <a href="${v.url}" target="_blank" style="color:#FF6600; font-weight:bold; text-decoration:none;">查看 ↗</a>
                  </div>`).join('')}
              </div>
              <div class="card" style="background:rgba(255,102,0,0.15); border-color:#FF6600; text-align:center;">
                <div style="color:#FF6600; font-weight:bold; font-size:14px;">感謝參與橘子集團 2027 校園徵才！</div>
                <p style="color:#fff; font-size:12px; margin-top:4px;">🎁 出示此畫面給工作人員，即可兌換精美好禮！</p>
              </div>
            </div>`;
        }
      }

      function selectOpt(i) { answers[qIdx] = i; render(); }
      function submitAns() {
        if (answers[qIdx] === null) { document.getElementById('err').innerText = '請先選擇一個答案！'; return; }
        clearInterval(timer);
        currentStep = 'INTER'; iTime = 8; render();
        timer = setInterval(() => {
          iTime--;
          if (iTime <= 0) {
            clearInterval(timer);
            if (qIdx < 4) { qIdx++; currentStep = 'GAME'; render(); startQTimer(); }
            else { currentStep = 'RESULT'; render(); }
          } else { const el = document.getElementById('i-timer'); if (el) el.innerText = iTime; }
        }, 1000);
      }

      function startQTimer() {
        clearInterval(timer); qTime = 8;
        timer = setInterval(() => {
          qTime--;
          const el = document.getElementById('timer-txt');
          if (qTime <= 0) { if (el) el.innerText = '請儘快選擇答案並點擊送出！'; }
          else { if (el) el.innerText = `倒數 ${qTime} 秒`; }
        }, 1000);
      }

      function getResult() {
        const counts = { INNOVATOR:0, ANALYST:0, CONNECTOR:0, EXPLORER:0 };
        answers.forEach((ans, i) => { if (ans !== null) counts[QUESTIONS[i].options[ans].type]++; });
        return Object.keys(counts).reduce((a, b) => counts[a] >= counts[b] ? a : b);
      }

      document.getElementById('show-qr-btn').onclick = () => {
        document.getElementById('qr-modal').classList.remove('hidden');
        if (!qrGenerated) {
          const qrContainer = document.getElementById('qrcode');
          qrContainer.innerHTML = '';
          new QRCode(qrContainer, {
            text: window.location.href,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });
          qrGenerated = true;
        }
      };
      document.getElementById('close-qr-btn').onclick = () => document.getElementById('qr-modal').classList.add('hidden');

      render();
    </script>
  </body>
</html>
