<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>橘勢待發，職場勝局｜2027 台灣大學校園徵才</title>
    <!-- 引入 Tailwind CSS CDN，確保樣式 100% 正常顯示 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 QRCode 生成函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  </head>
  <body class="bg-[#121212] text-white min-h-screen font-sans flex flex-col justify-between">
    <!-- Header -->
    <header class="p-4 border-b border-[#333333] flex justify-between items-center max-w-md mx-auto w-full">
      <div class="flex items-center space-x-2">
        <span class="w-3 h-3 rounded-full bg-[#FF6600]"></span>
        <span class="font-extrabold tracking-wider text-sm">GAMANIA 2027</span>
      </div>
      <button id="show-qr-btn" class="bg-[#1A1A1A] border border-[#333333] px-3 py-1 rounded-lg text-xs font-mono flex items-center space-x-1 text-gray-300 hover:border-[#FF6600]">
        <span>📱 現場 QR</span>
      </button>
    </header>

    <!-- Main Content App -->
    <main id="app" class="p-4 max-w-md mx-auto w-full flex-1 flex flex-col justify-center"></main>

    <!-- Footer -->
    <footer class="p-4 border-t border-[#333333] text-center text-xs text-gray-500 max-w-md mx-auto w-full">
      © 2027 遊戲橘子集團 Gamania Group. All Rights Reserved.
    </footer>

    <!-- QR Code Modal 彈窗 -->
    <div id="qr-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
      <div class="bg-[#1A1A1A] border border-[#FF6600] p-6 rounded-2xl max-w-xs w-full text-center space-y-4">
        <div class="text-sm font-bold text-white">掃描開啟 2027 校徵探索遊戲</div>
        <div class="bg-white p-3 rounded-xl inline-block">
          <canvas id="qr-canvas"></canvas>
        </div>
        <p class="text-xs text-gray-400">請同學們使用手機相機掃描 QR Code 參與測試！</p>
        <button id="close-qr-btn" class="w-full py-2 bg-[#333333] text-white text-xs rounded-lg font-bold">
          關閉視窗
        </button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
