<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>橘勢待發，職場勝局｜2027 台灣大學校園徵才</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
      header { width: 100%; max-width: 440px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333333; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; letter-spacing: 1px; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background-color: #FF6600; }
      .sync-tag { font-size: 11px; padding: 4px 8px; border-radius: 12px; background: rgba(255,102,0,0.15); border: 1px solid #FF6600; color: #FF6600; font-weight: bold; }
      main { width: 100%; max-width: 440px; margin: auto; padding: 20px 0; flex: 1; }
      footer { width: 100%; max-width: 440px; margin: 0 auto; text-align: center; font-size: 11px; color: #666; padding: 12px 0; border-top: 1px solid #333333; }
      .card { background: #1A1A1A; border: 1px solid #333; border-radius: 16px; padding: 20px; text-align: left; margin-bottom: 16px; }
      .title { color: #FF6600; font-size: 24px; font-weight: 800; text-align: center; margin: 12px 0; }
      .badge { display: inline-block; background: rgba(255,102,0,0.15); border: 1px solid #FF6600; color: #FF6600; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 8px; text-align: center; }
      .primary-btn { width: 100%; background: #FF6600; color: #000; font-weight: 800; font-size: 16px; padding: 14px; border-radius: 12px; border: none; cursor: pointer; margin-top: 12px; }
      .primary-btn:hover { background: #ff771a; }
      .opt-btn { width: 100%; background: #1A1A1A; border: 1px solid #333; color: #ddd; padding: 14px; border-radius: 12px; text-align: left; margin-bottom: 10px; cursor: pointer; font-size: 14px; display: flex; gap: 10px; transition: 0.2s; }
      .opt-btn.selected { border-color: #FF6600; background: rgba(255,102,0,0.25); color: #fff; font-weight: bold; }
      .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
      .progress-fill { height: 100%; background: #FF6600; transition: width 0.2s linear; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><div class="dot"></div>GAMANIA 2027</div>
      <div class="sync-tag">⚡ 職涯探索</div>
    </header>

    <main id="app"></main>

    <footer>© 2027 橘子集團 Gamania Group. All Rights Reserved.</footer>

    <script>
      const VACANCIES = {
        INNOVATOR: [{ name: "遊戲企劃 / 遊戲設計師", url: "https://www.104.com.tw" }, { name: "品牌營銷企劃專員", url: "https://www.104.com.tw" }],
        ANALYST: [{ name: "全端開發工程師", url: "https://www.104.com.tw" }, { name: "數據分析工程師", url: "https://www.104.com.tw" }],
        CONNECTOR: [{ name: "跨國專案管理師 (PM)", url: "https://www.104.com.tw" }, { name: "社群營運專員", url: "https://www.104.com.tw" }],
        EXPLORER: [{ name: "使用者體驗 UX 研究員", url: "https://www.104.com.tw" }, { name: "創新產品市場分析師", url: "https://www.104.com.tw" }]
      };

      const QUESTIONS = [
        { id: 1, title: "專案啟動時，你最想扮演什麼角色？", options: [{ text: "提出顛覆性的創新概念與酷炫玩法", type: "INNOVATOR" }, { text: "規劃技術架構與數據分析流程", type: "ANALYST" }, { text: "跨團隊溝通協調，確保時程順利推進", type: "CONNECTOR" }, { text: "觀察玩家與市場潛在需求，找出新痛點", type: "EXPLORER" }] },
        { id: 2, title: "當遇到突發的系統 Bug 或專案瓶頸，你會？", options: [{ text: "腦力激盪，試圖用非傳統的妙招繞過限制", type: "INNOVATOR" }, { text: "冷靜分析 Error Log，逐步除錯與定位問題", type: "ANALYST" }, { text: "快速召集相關成員，整合資源共同決策", type: "CONNECTOR" }, { text: "深入了解使用者的真實反饋，確認修復方向", type: "EXPLORER" }] },
        { id: 3, title: "在團隊合作中，身邊的人最常稱讚你的是？", options: [{ text: "點子王！總是有源源不絕的靈感", type: "INNOVATOR" }, { text: "邏輯大師！邏輯嚴密且說服力強", type: "ANALYST" }, { text: "神級隊友！有你在進度就很令人安心", type: "CONNECTOR" }, { text: "敏銳雷達！總能察覺別人忽視的細節", type: "EXPLORER" }] },
        { id: 4, title: "面對充滿不確定性的新任務時，你的第一步是？", options: [{ text: "邊做邊嘗試，在實作中驗證各種有趣想法", type: "INNOVATOR" }, { text: "蒐集市場數據與文獻，做嚴謹的評估報告", type: "ANALYST" }, { text: "拜訪相關領域的專家或夥伴，建立合作機制", type: "CONNECTOR" }, { text: "觀察競品優缺點，發掘尚未被滿足的缺口", type: "EXPLORER" }] },
        { id: 5, title: "理想中的工作成就感來自於？", options: [{ text: "打造出令人驚豔、前所未見的創新產品", type: "INNOVATOR" }, { text: "破解高難度複雜問題，優化系統效率", type: "ANALYST" }, { text: "帶領團隊突破重圍，順利達成共同目標", type: "CONNECTOR" }, { text: "洞察市場趨勢，引領全新的商業方向", type: "EXPLORER" }] }
      ];

      const ROLES = {
        INNOVATOR: { title: "創意發想型", subtitle: "The Creative Trailblazer", desc: "你擁有強大的想像力與突破框架的勇氣！在橘子集團，你總是能為產品注入驚喜與新鮮感。" },
        ANALYST: { title: "邏輯解題型", subtitle: "The Master Mind", desc: "你具備卓越的條理性與數據敏感度！在橘子集團，你能精準找到關鍵解法。" },
        CONNECTOR: { title: "連結推進型", subtitle: "The Project Catalyst", desc: "你是團隊中不可或缺的黏著劑與推手！在橘子集團，你能將多元資源轉化為執行力。" },
        EXPLORER: { title: "洞察探索型", subtitle: "The Strategic Visionary", desc: "你對周遭變化有著敏銳的感知力！在橘子集團，你協助團隊在市場中取得先機。" }
      };

      let currentQIdx = 0;
      let answers = [null, null, null, null, null];
      let remainSec = 10;
      let timer = null;

      function renderHome() {
        const app = document.getElementById('app');
        if (!app) return;
        app.innerHTML = `
          <div style="text-align:center;">
            <div class="badge">2027 台灣大學校園徵才</div>
            <h1 class="title">橘勢待發，職場勝局</h1>
            <p style="color:#aaa; font-size:14px; line-height:1.6; margin-bottom:16px;">透過 5 道職涯情境問答，探索你在橘子集團的獨特天賦！</p>
            <div class="card" style="font-size:12px; color:#ccc;">
              <b style="color:#fff;">💡 說明：</b>點擊開始後將直接進入第 1 題！每題<b>作答倒數 10 秒</b>，倒數結束自動切換下一題。
            </div>
            <button id="join-btn" class="primary-btn">開始職涯探索 →</button>
          </div>`;
        
        document.getElementById('join-btn').onclick = startTest;
      }

      function startTest() {
        currentQIdx = 0;
        answers = [null, null, null, null, null];
        showQuestion();
      }

      function showQuestion() {
        // 如果 5 題都結束了，立刻進入結果頁面
        if (currentQIdx >= 5) {
          if (timer) clearInterval(timer);
          renderResult();
          return;
        }

        remainSec = 10;
        const app = document.getElementById('app');
        const q = QUESTIONS[currentQIdx];

        app.innerHTML = `
          <div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#aaa; margin-bottom:8px;">
              <span>QUESTION ${currentQIdx + 1} / 5</span>
              <span id="timer-txt" style="color:#FF6600; font-weight:bold;">⏳ 倒數 ${remainSec} 秒</span>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:100%;"></div></div>
            <h2 style="font-size:16px; margin-bottom:16px; font-weight:bold;">${q.title}</h2>
            ${q.options.map((opt, i) => `
              <button class="opt-btn ${answers[currentQIdx] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
                <span style="border:1px solid currentColor; padding:0 6px; border-radius:4px; font-weight:bold;">${String.fromCharCode(65+i)}</span>
                <span>${opt.text}</span>
              </button>`).join('')}
            <p style="color:#666; font-size:11px; text-align:center; margin-top:10px;">💡 請點擊選項鎖定答案，10 秒結束後自動跳下一題</p>
          </div>`;

        // 開啟 10 秒倒數計時器
        if (timer) clearInterval(timer);
        timer = setInterval(() => {
          remainSec--;
          const timerTxt = document.getElementById('timer-txt');
          const fill = document.getElementById('progress-fill');
          if (timerTxt) timerTxt.innerText = `⏳ 倒數 ${remainSec} 秒`;
          if (fill) fill.style.width = `${(remainSec / 10) * 100}%`;

          // 時間到，進入下一題
          if (remainSec <= 0) {
            clearInterval(timer);
            // 若學生未選擇答案，預設帶入第一個選項
            if (answers[currentQIdx] === null) {
              answers[currentQIdx] = 0;
            }
            currentQIdx++;
            showQuestion();
          }
        }, 1000);
      }

      function selectOpt(optIdx) {
        answers[currentQIdx] = optIdx;
        // 重新繪製畫面以高亮顯示選中的選項
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach((btn, idx) => {
          if (idx === optIdx) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      }

      function renderResult() {
        // 100% 徹底關閉背景計時器，防止任何重複觸發
        if (timer) {
          clearInterval(timer);
          timer = null;
        }

        const topRoles = getResult();
        let roleHeaderHTML = '';
        let vacancyList = [];

        if (topRoles.length > 1) {
          const r1 = ROLES[topRoles[0]];
          const r2 = ROLES[topRoles[1]];
          roleHeaderHTML = `
            <div class="badge" style="background:rgba(255,215,0,0.15); border-color:#FFD700; color:#FFD700;">🌟 雙重天賦 / 跨界型人才</div>
            <h2 style="font-size:20px; color:#fff; margin:8px 0;">${r1.title} × ${r2.title}</h2>
            <p style="color:#aaa; font-size:12px; margin-bottom:12px;">${r1.subtitle} & ${r2.subtitle}</p>
            <p style="color:#ddd; font-size:13px; text-align:left; line-height:1.5;">你在多個面向展現出均勻且強大的潛力！同時具備 ${r1.title} 與 ${r2.title} 的特色，在橘子集團是極具彈性與跨界整合能力的關鍵角色。</p>
          `;
          vacancyList = [...(VACANCIES[topRoles[0]] || []), ...(VACANCIES[topRoles[1]] || [])];
        } else {
          const role = ROLES[topRoles[0]];
          roleHeaderHTML = `
            <div style="color:#FF6600; font-size:12px; font-weight:bold;">YOUR CAREER ARCHETYPE</div>
            <h2 style="font-size:22px; color:#fff; margin:8px 0;">${role.title}</h2>
            <p style="color:#aaa; font-size:12px; margin-bottom:12px;">${role.subtitle}</p>
            <p style="color:#ddd; font-size:13px; text-align:left; line-height:1.5;">${role.desc}</p>
          `;
          vacancyList = VACANCIES[topRoles[0]] || [];
        }

        document.getElementById('app').innerHTML = `
          <div>
            <div class="card" style="border-color:#FF6600; text-align:center;">
              ${roleHeaderHTML}
            </div>
            <div class="card">
              <div style="color:#fff; font-size:13px; font-weight:bold; margin-bottom:8px;">🚀 推薦延伸職缺領域</div>
              ${vacancyList.map(v => `
                <div style="display:flex; justify-content:space-between; background:#121212; padding:8px 12px; border-radius:8px; font-size:12px; margin-bottom:6px;">
                  <span>${v.name}</span>
                  <a href="${v.url}" target="_blank" style="color:#FF6600; font-weight:bold; text-decoration:none;">查看 ↗</a>
                </div>`).join('')}
            </div>
            <div class="card" style="background:rgba(255,102,0,0.15); border-color:#FF6600; text-align:center;">
              <div style="color:#FF6600; font-weight:bold; font-size:14px;">感謝參與橘子集團 2027 校園徵才！</div>
              <p style="color:#fff; font-size:12px; margin-top:6px; font-weight:bold;">🎟️ 憑此結果頁面或活動憑票，即可向現場工作人員兌換專屬精美好禮！</p>
            </div>
          </div>`;
      }

      function getResult() {
        const counts = { INNOVATOR: 0, ANALYST: 0, CONNECTOR: 0, EXPLORER: 0 };
        answers.forEach((ansIndex, qIndex) => {
          if (ansIndex !== null && QUESTIONS[qIndex] && QUESTIONS[qIndex].options[ansIndex]) {
            const type = QUESTIONS[qIndex].options[ansIndex].type;
            counts[type] = (counts[type] || 0) + 1;
          } else {
            const types = ['INNOVATOR', 'ANALYST', 'CONNECTOR', 'EXPLORER'];
            counts[types[qIndex % 4]]++;
          }
        });

        let maxCount = -1;
        for (const type in counts) {
          if (counts[type] > maxCount) maxCount = counts[type];
        }

        const winners = [];
        for (const type in counts) {
          if (counts[type] === maxCount) winners.push(type);
        }
        return winners;
      }

      window.addEventListener('DOMContentLoaded', renderHome);
      window.addEventListener('load', renderHome);
    </script>
  </body>
</html>
