<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>橘勢待發，職場勝局｜2027 台大校招</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
      header { width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #333333; }
      .brand { display: flex; align-items: center; }
      
      /* 🍊 終極去白底修正：改用 multiply 混合模式，完美把 JPG 的純白背景消除 */
      .brand img { 
        height: 36px; 
        width: auto; 
        object-fit: contain; 
        mix-blend-mode: multiply;
        filter: contrast(1.25) brightness(1.1);
      }
      
      .brand-text { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: 1px; }
      .dot { width: 14px; height: 14px; border-radius: 50%; background-color: #FF6600; }
      .sync-tag { font-size: 14px; padding: 6px 14px; border-radius: 16px; background: rgba(255,102,0,0.15); border: 1px solid #FF6600; color: #FF6600; font-weight: bold; }
      main { width: 100%; max-width: 500px; margin: auto; padding: 24px 0; flex: 1; }
      footer { width: 100%; max-width: 500px; margin: 0 auto; text-align: center; font-size: 14px; color: #888; padding: 16px 0; border-top: 1px solid #333333; }
      .card { background: #1A1A1A; border: 1px solid #333; border-radius: 18px; padding: 24px; text-align: left; margin-bottom: 20px; }
      .title { color: #FF6600; font-size: 32px; font-weight: 900; text-align: center; margin: 16px 0; letter-spacing: 1px; }
      .badge { display: inline-block; background: rgba(255,102,0,0.15); border: 1px solid #FF6600; color: #FF6600; padding: 8px 18px; border-radius: 20px; font-size: 16px; margin-bottom: 12px; font-weight: bold; text-align: center; }
      .primary-btn { width: 100%; background: #FF6600; color: #000; font-weight: 900; font-size: 20px; padding: 18px; border-radius: 14px; border: none; cursor: pointer; margin-top: 18px; }
      .primary-btn:hover { background: #ff771a; }
      .opt-btn { width: 100%; background: #1A1A1A; border: 1.5px solid #333; color: #eee; padding: 18px 20px; border-radius: 14px; text-align: left; margin-bottom: 14px; cursor: pointer; font-size: 18px; line-height: 1.5; display: flex; gap: 14px; align-items: center; transition: 0.2s; }
      .opt-btn.selected { border-color: #FF6600; background: rgba(255,102,0,0.25); color: #fff; font-weight: bold; }
      .progress-bar { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-bottom: 22px; }
      .progress-fill { height: 100%; background: #FF6600; transition: width 0.2s linear; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="./logo.jpg" alt="GAMANIA 2027" onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='flex';" />
        <div id="brand-fallback" class="brand-text" style="display:none;">
          <div class="dot"></div>GAMANIA 2027
        </div>
      </div>
      <div class="sync-tag">⚡ 職涯探索</div>
    </header>

    <main id="app"></main>

    <footer>© 2027 橘子集團 Gamania Group. All Rights Reserved.</footer>

    <script>
      const VACANCIES = {
        INNOVATOR: [
          { name: "遊戲企劃 / 遊戲設計師", url: "https://www.104.com.tw" },
          { name: "品牌營銷企劃專員", url: "https://www.104.com.tw" }
        ],
        ANALYST: [
          { name: "全端開發工程師", url: "https://www.104.com.tw" },
          { name: "數據分析工程師", url: "https://www.104.com.tw" }
        ],
        CONNECTOR: [
          { name: "跨國專案管理師 (PM)", url: "https://www.104.com.tw" },
          { name: "社群營運專員", url: "https://www.104.com.tw" }
        ],
        EXPLORER: [
          { name: "使用者體驗 UX 研究員", url: "https://www.104.com.tw" },
          { name: "創新產品市場分析師", url: "https://www.104.com.tw" }
        ]
      };

      const QUESTIONS = [
        {
          id: 1,
          title: "專案啟動時，你最想扮演什麼角色？",
          options: [
            { text: "提出顛覆性的創新概念與酷炫玩法", type: "INNOVATOR" },
            { text: "規劃技術架構與數據分析流程", type: "ANALYST" },
            { text: "跨團隊溝通協調，確保時程順利推進", type: "CONNECTOR" },
            { text: "觀察玩家與市場潛在需求，找出新痛點", type: "EXPLORER" }
          ]
        },
        {
          id: 2,
          title: "當遇到突發的系統 Bug 或專案瓶頸，你會？",
          options: [
            { text: "腦力激盪，試圖用非傳統的妙招繞過限制", type: "INNOVATOR" },
            { text: "冷靜分析 Error Log，逐步除錯與定位問題", type: "ANALYST" },
            { text: "快速召集相關成員，整合資源共同決策", type: "CONNECTOR" },
            { text: "深入了解使用者的真實反饋，確認修復方向", type: "EXPLORER" }
          ]
        },
        {
          id: 3,
          title: "在團隊合作中，身邊的人最常稱讚你的是？",
          options: [
            { text: "點子王！總是有源源不絕的靈感", type: "INNOVATOR" },
            { text: "邏輯大師！邏輯嚴密且說服力強", type: "ANALYST" },
            { text: "神級隊友！有你在進度就很令人安心", type: "CONNECTOR" },
            { text: "敏銳雷達！總能察覺別人忽視的細節", type: "EXPLORER" }
          ]
        },
        {
          id: 4,
          title: "面對充滿不確定性的新任務時，你的第一步是？",
          options: [
            { text: "邊做邊嘗試，在實作中驗證各種有趣想法", type: "INNOVATOR" },
            { text: "蒐集市場數據與文獻，做嚴謹的評估報告", type: "ANALYST" },
            { text: "拜訪相關領域的專家或夥伴，建立合作機制", type: "CONNECTOR" },
            { text: "觀察競品優缺點，發掘尚未被滿足的缺口", type: "EXPLORER" }
          ]
        },
        {
          id: 5,
          title: "理想中的工作成就感來自於？",
          options: [
            { text: "打造出令人驚豔、前所未見的創新產品", type: "INNOVATOR" },
            { text: "破解高難度複雜問題，優化系統效率", type: "ANALYST" },
            { text: "帶領團隊突破重圍，順利達成共同目標", type: "CONNECTOR" },
            { text: "洞察市場趨勢，引領全新的商業方向", type: "EXPLORER" }
          ]
        }
      ];

      const ROLES = {
        INNOVATOR: {
          title: "創意發想型 💡",
          desc: "你擁有強大的想像力與打破框架的勇氣！不論是遊戲玩法、品牌活動還是產品體驗，你總能為橘子集團注入源源不絕的驚喜與新鮮感。"
        },
        ANALYST: {
          title: "邏輯解題型 🔍",
          desc: "你具備卓越的條理性與嚴密的數據敏感度！面對高難度技術挑戰或複雜業務痛點，你能迅速梳理邏輯、找到關鍵解法，是團隊最堅實的智囊。"
        },
        CONNECTOR: {
          title: "連結推進型 🤝",
          desc: "你是團隊中不可或缺的黏著劑與最強推手！具備高敏銳度的溝通共情力，能完美整合跨團隊資源，引領大家突破重圍、順利達成共同目標。"
        },
        EXPLORER: {
          title: "洞察探索型 🔭",
          desc: "你對周遭環境與市場變化有著雷達般敏銳的感知力！總能察覺別人忽視的細節，發掘全新的使用者需求，帶領橘子集團在產業中搶先取得勝局。"
        },
        NONE: {
          title: "沉思解構型 🧘‍♂️",
          desc: "你在面對職場選擇時，習慣保持冷靜觀察、不輕易下定義！在橘子集團，這種『不隨波逐流，善於觀望全貌與保持專注』的特質，正是許多跨領域創新專案中最需要的沉著力量。"
        }
      };

      let qIndex = 0;
      let userAnswers = [null, null, null, null, null];
      let timerId = null;
      let secLeft = 10;

      function stopTimer() {
        if (timerId) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function initApp() {
        stopTimer();
        qIndex = 0;
        userAnswers = [null, null, null, null, null];
        
        const app = document.getElementById('app');
        if (!app) return;

        app.innerHTML = `
          <div style="text-align:center;">
            <div class="badge">2027 台大校招</div>
            <h1 class="title">橘勢待發，職場勝局</h1>
            <p style="color:#bbb; font-size:18px; line-height:1.6; margin-bottom:20px;">透過 5 道職涯情境問答，探索你在橘子集團的獨特天賦！</p>
            <div class="card" style="font-size:16px; color:#ddd; line-height:1.6;">
              <b style="color:#FF6600;">💡 測驗說明：</b><br>點擊開始後將直接進入第 1 題！每題<b>作答時間 10 秒</b>，倒數結束後自動切換至下一題。
            </div>
            <button id="start-btn" class="primary-btn">開始職涯探索 →</button>
          </div>`;
        
        document.getElementById('start-btn').onclick = runQuiz;
      }

      function runQuiz() {
        stopTimer();

        if (qIndex >= 5) {
          showResultPage();
          return;
        }

        secLeft = 10;
        const app = document.getElementById('app');
        const currentQ = QUESTIONS[qIndex];

        app.innerHTML = `
          <div>
            <div style="display:flex; justify-content:space-between; font-size:16px; color:#aaa; margin-bottom:12px;">
              <span>QUESTION ${qIndex + 1} / 5</span>
              <span id="timer-txt" style="color:#FF6600; font-weight:bold; font-size:18px;">⏳ 倒數 ${secLeft} 秒</span>
            </div>
            <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:100%;"></div></div>
            <h2 style="font-size:22px; margin-bottom:24px; font-weight:800; line-height:1.4;">${currentQ.title}</h2>
            ${currentQ.options.map((opt, i) => `
              <button class="opt-btn ${userAnswers[qIndex] === i ? 'selected' : ''}" onclick="pickOption(${i})">
                <span style="border:1.5px solid currentColor; padding:3px 10px; border-radius:6px; font-weight:bold; font-size:16px;">${String.fromCharCode(65+i)}</span>
                <span>${opt.text}</span>
              </button>`).join('')}
            <p style="color:#888; font-size:14px; text-align:center; margin-top:16px;">💡 請點擊選項鎖定答案，10 秒結束後自動跳下一題</p>
          </div>`;

        timerId = setInterval(() => {
          secLeft--;
          const txt = document.getElementById('timer-txt');
          const bar = document.getElementById('progress-fill');
          if (txt) txt.innerText = `⏳ 倒數 ${secLeft} 秒`;
          if (bar) bar.style.width = `${(secLeft / 10) * 100}%`;

          if (secLeft <= 0) {
            stopTimer();
            qIndex++;
            runQuiz();
          }
        }, 1000);
      }

      function pickOption(optIdx) {
        userAnswers[qIndex] = optIdx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((btn, i) => {
          if (i === optIdx) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
      }

      function showResultPage() {
        stopTimer();

        const answeredCount = userAnswers.filter(a => a !== null).length;
        const resultData = calculateScores();
        const winningTypes = resultData.winners;

        let roleHTML = '';
        let jobList = [];

        if (answeredCount === 0) {
          const role = ROLES.NONE;
          roleHTML = `
            <div class="badge" style="background:rgba(255,255,255,0.1); border-color:#aaa; color:#aaa; font-size:14px;">專屬特別探索解析</div>
            <h2 style="font-size:30px; color:#FF6600; margin:8px 0 16px 0; font-weight:900;">${role.title}</h2>
            <p style="color:#ddd; font-size:16px; text-align:left; line-height:1.6;">${role.desc}</p>
          `;
          jobList = [...VACANCIES.EXPLORER, ...VACANCIES.INNOVATOR];
        } 
        else if (winningTypes.length > 1) {
          const r1 = ROLES[winningTypes[0]];
          const r2 = ROLES[winningTypes[1]];
          const badgeNotice = answeredCount < 5 ? `<div style="font-size:13px; color:#aaa; margin-bottom:8px;">💡 基於你已完成的 ${answeredCount} 道題進行分析</div>` : '';
          roleHTML = `
            ${badgeNotice}
            <div class="badge" style="background:rgba(255,215,0,0.15); border-color:#FFD700; color:#FFD700; font-size:16px;">🌟 雙重天賦 / 跨界型人才</div>
            <h2 style="font-size:28px; color:#fff; margin:12px 0;">${r1.title} × ${r2.title}</h2>
            <p style="color:#ddd; font-size:16px; text-align:left; line-height:1.6; margin-top:12px;">你在回答的題目中展現出均勻且強大的潛力！同時具備<b>【${r1.title}】</b>與<b>【${r2.title}】</b>的優勢，在橘子集團是極具彈性、能靈活應對各種突破性專案的跨界關鍵人才。</p>
          `;
          jobList = [...(VACANCIES[winningTypes[0]] || []), ...(VACANCIES[winningTypes[1]] || [])];
        } 
        else {
          const role = ROLES[winningTypes[0]];
          const badgeNotice = answeredCount < 5 ? `<div style="font-size:13px; color:#aaa; margin-bottom:8px;">💡 基於你已完成的 ${answeredCount} 道題進行分析</div>` : '';
          roleHTML = `
            ${badgeNotice}
            <div class="badge" style="font-size:15px;">你的專屬職場屬性</div>
            <h2 style="font-size:30px; color:#FF6600; margin:8px 0 16px 0; font-weight:900;">${role.title}</h2>
            <p style="color:#ddd; font-size:16px; text-align:left; line-height:1.6;">${role.desc}</p>
          `;
          jobList = VACANCIES[winningTypes[0]] || [];
        }

        document.getElementById('app').innerHTML = `
          <div>
            <div class="card" style="border-color:#FF6600; text-align:center;">
              ${roleHTML}
            </div>
            <div class="card">
              <div style="color:#fff; font-size:18px; font-weight:bold; margin-bottom:14px;">🚀 橘子集團推薦延伸職缺領域</div>
              ${jobList.map(v => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#121212; padding:14px 18px; border-radius:12px; font-size:16px; margin-bottom:10px; border:1px solid #2a2a2a;">
                  <span>${v.name}</span>
                  <a href="${v.url}" target="_blank" style="color:#FF6600; font-weight:bold; text-decoration:none; font-size:16px;">查看 ↗</a>
                </div>`).join('')}
            </div>
            <div class="card" style="background:rgba(255,102,0,0.15); border-color:#FF6600; text-align:center;">
              <div style="color:#FF6600; font-weight:bold; font-size:18px; margin-bottom:8px;">感謝參與橘子集團 2027 校園徵才！</div>
              <p style="color:#fff; font-size:15px; font-weight:bold; line-height:1.5;">🎟️ 憑此結果頁面或活動憑票，即可向現場工作人員兌換專屬精美好禮！</p>
            </div>
          </div>`;
      }

      function calculateScores() {
        const tally = { INNOVATOR: 0, ANALYST: 0, CONNECTOR: 0, EXPLORER: 0 };
        userAnswers.forEach((ansIndex, qIdx) => {
          if (ansIndex !== null && QUESTIONS[qIdx] && QUESTIONS[qIdx].options[ansIndex]) {
            const t = QUESTIONS[qIdx].options[ansIndex].type;
            tally[t] = (tally[t] || 0) + 1;
          }
        });

        let highest = -1;
        for (const k in tally) {
          if (tally[k] > highest) highest = tally[k];
        }

        const winners = [];
        if (highest > 0) {
          for (const k in tally) {
            if (tally[k] === highest) winners.push(k);
          }
        }
        return { winners, tally };
      }

      window.addEventListener('DOMContentLoaded', initApp);
      window.addEventListener('load', initApp);
    </script>
  </body>
</html>
