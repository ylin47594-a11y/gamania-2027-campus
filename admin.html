<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>橘子集團 2027 校徵｜現場控場控制台</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
      body { background: #121212; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
      h1 { color: #FF6600; font-size: 20px; margin-bottom: 12px; }
      .card { background: #1A1A1A; border: 1px solid #333; padding: 16px; border-radius: 12px; margin-bottom: 16px; text-align: left; }
      .btn { width: 100%; background: #FF6600; color: #000; font-weight: bold; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 8px; }
      .btn:hover { background: #ff8833; }
      .btn-secondary { background: #333; color: #fff; }
      .status { font-size: 12px; padding: 6px 12px; border-radius: 20px; display: inline-block; background: #222; border: 1px solid #444; color: #888; margin-bottom: 16px; }
      .status.online { border-color: #00FF66; color: #00FF66; }
    </style>
  </head>
  <body>
    <h1>🍊 橘子集團 2027 控制台</h1>
    <div id="conn-status" class="status">廣播通道連線中...</div>

    <div class="card">
      <div style="font-size:14px; font-weight:bold; color:#FF6600; margin-bottom:12px;">🎮 現場控場選單</div>
      <button class="btn" onclick="sendCmd('GOTO_QUESTION', 0)">1. 統一開啟：第 1 題</button>
      <button class="btn" onclick="sendCmd('GOTO_QUESTION', 1)">2. 統一切換：第 2 題</button>
      <button class="btn" onclick="sendCmd('GOTO_QUESTION', 2)">3. 統切換：第 3 題</button>
      <button class="btn" onclick="sendCmd('GOTO_QUESTION', 3)">4. 統一切換：第 4 題</button>
      <button class="btn" onclick="sendCmd('GOTO_QUESTION', 4)">5. 統一切換：第 5 題</button>
      <button class="btn" style="background:#00FF66; color:#000;" onclick="sendCmd('SHOW_RESULT')">🏆 統一公布結果頁面</button>
      <button class="btn btn-secondary" onclick="sendCmd('RESET')">🔄 重置全場回等待頁</button>
    </div>

    <script>
      const supabaseUrl = 'https://xyzcompany.supabase.co';
      const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlc3QiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTYwOTQ1OTIwMCwiZXhwIjoyNTM0MDIzMDAwMDB9.test';
      const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

      const channel = supabase.channel('gamania-live-room');
      const statusEl = document.getElementById('conn-status');

      channel.subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          statusEl.innerText = '🟢 控制台已廣播就緒 (全場同步)';
          statusEl.classList.add('online');
        }
      });

      function sendCmd(type, qIdx = 0) {
        channel.send({
          type: 'broadcast',
          event: 'CMD',
          payload: { type, qIdx }
        });
      }
    </script>
  </body>
</html>
